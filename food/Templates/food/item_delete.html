{% extends 'food/base.html' %}

{% block body %}
<div class="container mt-5">
    <div class="card p-4 shadow-lg rounded text-center">
        <h2 class="text-danger">Confirm Deletion</h2>
        <p class="mb-4">Are you sure you want to delete <strong>{{ item.item_name }}</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirm</button>
            <a href="{% url 'food:index' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
