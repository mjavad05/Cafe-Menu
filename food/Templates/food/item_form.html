{% extends 'food/base.html' %}

{% block body %}
<div class="container mt-5">
    <div class="card p-4 shadow-lg rounded">
        <h2 class="text-center mb-4">Add New Item</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn detail-btn">Save</button>
        </form>
    </div>
</div>
{% endblock %}
