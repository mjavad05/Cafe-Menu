{% extends 'food/base.html' %}
{% block body %}

<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%; border-radius: 20px; background-color: #fffaf0;">
        <div class="text-center mb-4">
            <img src="{{ user.profile.image.url }}" alt="Profile Image"
                 class="rounded-circle shadow-sm"
                 style="width: 150px; height: 150px; object-fit: cover; border: 5px solid #8d6b57;">
        </div>
        <h3 class="text-center" style="color: #4B2E2E;">{{ user.username }}</h3>
        <hr>
        <div class="mt-3" style="color: #4B2E2E;">
            <p><strong>Email:</strong> {{ user.email }}</p>
        </div>
        <div class="text-center mt-4">
            <a href="/food" class="btn detail-btn">Back to Home</a>
        </div>
    </div>
</div>

{% endblock %}
